<title>JSON Formatter - QuickWebTools</title>
<meta name="description" content="Format, validate, and minify JSON online.">

</head>

<body>

<nav class="navbar">
    <div class="logo">QuickWebTools</div>
    <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="../tools.html">Tools</a></li>
        <li><a href="../about.html">About</a></li>
        <li><a href="../contact.html">Contact</a></li>
    </ul>
</nav>

<section class="tools">
    <h1>JSON Formatter</h1>
    <p>Format, validate, dan minify JSON secara instan.</p>

    <div class="tool-card" style="max-width: 900px; margin: 0 auto;">
        <div style="display: grid; gap: 16px; text-align: left;">

            <div>
                <label for="jsonInput">Input JSON</label><br>
                <textarea id="jsonInput" placeholder="Paste JSON here..."></textarea>
            </div>

            <div class="tool-actions" style="display:flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn" type="button" onclick="formatJSON()">Format</button>
                <button class="btn" type="button" onclick="minifyJSON()">Minify</button>
                <button class="btn" type="button" onclick="validateJSON()">Validate</button>
                <button class="btn" type="button" onclick="clearJSON()">Clear</button>
                <button class="btn" type="button" onclick="copyJSON()">Copy</button>
            </div>

            <div>
                <label for="jsonOutput">Result</label><br>
                <textarea id="jsonOutput" readonly placeholder="Formatted JSON will appear here..."></textarea>
            </div>

            <div id="jsonStatus" style="color: var(--muted); font-size: 0.95rem;">
                Ready to format JSON...
            </div>

        </div>
    </div>
</section>
