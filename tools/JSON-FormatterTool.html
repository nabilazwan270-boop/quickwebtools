<section class="tools">
    <h1>JSON Formatter</h1>
    <p>Format, validate, dan minify JSON secara instan.</p>

    <div class="tool-card">

        <label>Input JSON</label>
        <textarea id="jsonInput" placeholder="Paste JSON here..."></textarea>

        <div style="margin-top:15px; display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn" onclick="formatJSON()">Format</button>
            <button class="btn" onclick="minifyJSON()">Minify</button>
            <button class="btn" onclick="validateJSON()">Validate</button>
            <button class="btn" onclick="clearJSON()">Clear</button>
            <button class="btn" onclick="copyJSON()">Copy</button>
        </div>

        <label style="margin-top:20px;">Output</label>
        <textarea id="jsonOutput" readonly></textarea>

        <p id="jsonStatus" style="margin-top:10px;"></p>

    </div>
</section>
